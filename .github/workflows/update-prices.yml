name: SIFI árfolyam-frissítés

on:
  schedule:
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Árfolyamok lehúzása
        run: node scrape.js
      - name: Commit, ha változott
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Árfolyam-frissítés: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nincs változás, nincs commit."
          fi
